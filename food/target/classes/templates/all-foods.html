<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全部食物 — 食物真相百科</title>
<style>
:root{--bg:#f7f4ef;--card:#fff;--t:#2c2416;--t2:#5c4e38;--t3:#8b7a62;--muted:#b5a68e;--red:#8b4513;--green:#2d5a27;--border:#e5dcd0;--r:12px;--sh:0 2px 12px rgba(0,0,0,0.06)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.7;color:var(--t);background:var(--bg)}
a{text-decoration:none;color:inherit}

.nav{background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.nav-inner{max-width:1300px;margin:0 auto;padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:56px;gap:4px}
.nav-logo{font-size:1rem;font-weight:700;color:var(--t);white-space:nowrap}
.nav-links{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}
.nav-links a{padding:6px 12px;border-radius:20px;font-size:0.82rem;color:var(--t2);transition:all 0.2s;white-space:nowrap}
.nav-links a:hover,.nav-links a.active{background:var(--red);color:#fff}
.nav-search{display:flex;align-items:center;gap:0}
.nav-search input{padding:7px 12px;font-size:0.85rem;border:1.5px solid var(--border);border-radius:20px 0 0 20px;background:var(--bg);color:var(--t);outline:none;width:140px}
.nav-search input:focus{border-color:var(--red)}
.nav-search button{padding:7px 14px;font-size:0.85rem;border:1.5px solid var(--red);border-left:none;border-radius:0 20px 20px 0;background:var(--red);color:#fff;cursor:pointer}
.nav-user{display:flex;align-items:center;gap:8px;font-size:0.82rem;margin-left:8px}
.nav-user span{color:var(--t3)}.nav-user a{color:var(--red);font-weight:500;padding:4px 10px;border-radius:12px;white-space:nowrap}
.nav-user a:hover{background:#fdf0ea}

.hero{text-align:center;padding:32px 20px 20px;max-width:700px;margin:0 auto}
.hero h1{font-size:1.5rem;font-weight:700;color:var(--t);margin-bottom:4px}
.hero .sub{font-size:0.9rem;color:var(--t3)}

.content{max-width:1200px;margin:0 auto 48px;padding:0 20px}
.section{margin-bottom:32px}
.sec-header{display:flex;align-items:baseline;gap:10px;padding-bottom:8px;border-bottom:2px solid var(--border);margin-bottom:16px}
.sec-header .s-emoji{font-size:1.4rem}
.sec-header .s-title{font-size:1.15rem;font-weight:700;color:var(--t)}
.sec-header .s-count{font-size:0.82rem;color:var(--t3)}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:var(--card);border-radius:var(--r);padding:20px 18px;box-shadow:var(--sh);transition:all 0.25s;display:flex;flex-direction:column;gap:10px}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.12)}
.card .c-top{display:flex;justify-content:space-between;align-items:flex-start}
.card .c-emoji{font-size:1.5rem}
.card .c-tag{font-size:0.7rem;padding:2px 8px;border-radius:6px;font-weight:500}
.card .c-tag.fh{background:#fdf0ea;color:var(--red)}
.card .c-tag.wa{background:#e8f5e4;color:var(--green)}
.card .c-name{font-size:1.05rem;font-weight:700;color:var(--t)}
.card .c-hook{font-size:0.88rem;color:var(--t2);line-height:1.6;flex:1;padding-left:0;border-left:3px solid transparent;transition:all 0.2s}
.card:hover .c-hook{border-left-color:var(--red);padding-left:10px}
.card .c-footer{display:flex;justify-content:space-between;align-items:center;font-size:0.78rem;color:var(--muted)}
.card .c-cta{color:var(--red);font-weight:600}

.footer{text-align:center;padding:20px 20px 48px;color:var(--muted);font-size:0.82rem}

@media(max-width:1024px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){
  .nav-inner{flex-direction:column;height:auto;padding:8px 12px;gap:6px}
  .nav-links a{padding:5px 10px;font-size:0.75rem}
  .grid{grid-template-columns:1fr}.content{padding:0 16px}
  .hero{padding:24px 16px 12px}.hero h1{font-size:1.3rem}
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a class="nav-logo" href="/">食物真相百科</a>
    <div class="nav-links">
      <a href="/">🏠 首页</a>
      <a th:each="c : ${categories}"
         th:href="@{/category/{name}(name=${c})}"
         th:text="${catEmoji.getOrDefault(c,'📂')} + ' ' + ${c}">分类</a>
      <a href="/all-foods" class="active">📋 全部</a><a href="/recipes">🍳 菜谱</a><a href="/shopping">🛒买菜</a>
    </div>
    <div class="nav-user" sec:authorize="!isAuthenticated()"><a href="/login">登录</a></div>
    <div class="nav-user" sec:authorize="isAuthenticated()">
      <a href="/favorites">⭐收藏</a><span sec:authentication="name">用户</span>
      <form method="post" action="/logout" style="display:inline"><button type="submit" style="background:none;border:none;color:var(--t3);cursor:pointer;font-size:0.8rem">退出</button></form>
    </div>
    <form class="nav-search" action="/search" method="get">
      <input type="text" name="q" placeholder="搜索食物...">
      <button type="submit">🔍</button>
    </form>
  </div>
</nav>

<header class="hero">
  <h1>📋 全部食物</h1>
  <p class="sub">所有食物按分类浏览</p>
</header>

<div class="content">
  <th:block th:each="entry : ${grouped}">
    <div class="section">
      <div class="sec-header">
        <span class="s-emoji" th:text="${catEmoji.getOrDefault(entry.key,'📂')}">🥤</span>
        <span class="s-title" th:text="${entry.key}">分类</span>
        <span class="s-count" th:text="${entry.value.size()} + ' 种'">0</span>
      </div>
      <div class="grid">
        <a class="card" th:each="f : ${entry.value}" th:href="@{/foods/{id}(id=${f.id})}">
          <div class="c-top">
            <span class="c-emoji" th:text="${foodEmoji.getOrDefault(f.name,'📋')}">🥝</span>
            <span class="c-tag" th:class="${f.tag} == '伪健康' ? 'fh' : 'wa'"
                  th:text="${f.tag}">标签</span>
          </div>
          <div class="c-name" th:text="${f.name}">食物名</div>
          <div class="c-hook" th:if="${!#lists.isEmpty(f.myths)}" th:text="'❌ ' + ${f.myths[0].myth}">误区</div>
          <div class="c-footer">
            <span th:text="${#lists.size(f.myths)} + ' 条真相'">X条</span>
            <span class="c-cta">查看 →</span>
          </div>
        </a>
      </div>
    </div>
  </th:block>
</div>

<footer class="footer">食物真相百科 · 用科学证据说话</footer>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 — 食物真相百科</title>
<style>
:root{--bg:#f7f4ef;--card:#fff;--t:#2c2416;--t2:#5c4e38;--t3:#8b7a62;--red:#8b4513;--green:#2d5a27;--border:#e5dcd0;--r:12px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.7;color:var(--t);background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border-radius:var(--r);padding:40px 32px;box-shadow:0 4px 20px rgba(0,0,0,0.08);width:100%;max-width:400px;margin:20px}
.card h1{font-size:1.5rem;font-weight:700;text-align:center;margin-bottom:6px}
.card .sub{text-align:center;font-size:0.88rem;color:var(--t3);margin-bottom:24px}
.form-row{display:flex;flex-direction:column;gap:4px;margin-bottom:16px}
.form-row label{font-size:0.85rem;color:var(--t2);font-weight:500}
.form-row input{width:100%;padding:10px 14px;font-size:0.95rem;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--t);outline:none}
.form-row input:focus{border-color:var(--red)}
.btn{width:100%;padding:12px;font-size:1rem;background:var(--green);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:background 0.2s}
.btn:hover{background:#3a6e33}
.error{background:#fdecea;color:#c0392b;padding:10px 14px;border-radius:8px;font-size:0.85rem;margin-bottom:16px;text-align:center}
.success{background:#e8f5e9;color:var(--green);padding:10px 14px;border-radius:8px;font-size:0.85rem;margin-bottom:16px;text-align:center}
.footer-text{text-align:center;margin-top:20px;font-size:0.85rem;color:var(--t3)}
.footer-text a{color:var(--red);font-weight:500;text-decoration:none}
.footer-text a:hover{text-decoration:underline}
.back{text-align:center;margin-top:12px}.back a{color:var(--t3);font-size:0.82rem;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <h1>登录</h1>
  <p class="sub">食物真相百科</p>
  <div class="success" th:if="${param.registered != null}">注册成功，请登录</div>
  <div class="error" th:if="${param.error != null}">用户名或密码错误</div>
  <form method="post" action="/login">
    <div class="form-row">
      <label>用户名</label>
      <input type="text" name="username" required autofocus>
    </div>
    <div class="form-row">
      <label>密码</label>
      <input type="password" name="password" required>
    </div>
    <button class="btn" type="submit">登录</button>
  </form>
  <p class="footer-text">还没有账号？<a href="/register">立即注册</a></p>
  <p class="back"><a href="/">← 返回首页</a></p>
</div>
</body>
</html>

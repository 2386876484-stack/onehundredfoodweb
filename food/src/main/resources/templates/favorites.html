<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的收藏 — 食物真相百科</title>
<style>
:root{--bg:#f7f4ef;--card:#fff;--t:#2c2416;--t2:#5c4e38;--t3:#8b7a62;--muted:#b5a68e;--red:#8b4513;--green:#2d5a27;--border:#e5dcd0;--r:12px;--sh:0 2px 12px rgba(0,0,0,0.06)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.7;color:var(--t);background:var(--bg)}
a{text-decoration:none;color:inherit}

.nav{background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.nav-inner{max-width:1300px;margin:0 auto;padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:56px;gap:8px}
.nav-logo{font-size:1rem;font-weight:700;color:var(--t);white-space:nowrap}
.nav-links{display:flex;gap:2px;flex-wrap:wrap;align-items:center}
.nav-links a{padding:6px 12px;border-radius:20px;font-size:0.82rem;color:var(--t2);transition:all 0.2s;white-space:nowrap}
.nav-links a:hover{background:var(--red);color:#fff}
.nav-links a.active{background:var(--red);color:#fff}
.nav-user{display:flex;align-items:center;gap:8px;font-size:0.82rem}
.nav-user span{color:var(--t3)}
.nav-user a{color:var(--red);font-weight:500;padding:4px 10px;border-radius:12px}
.nav-user a:hover{background:#fdf0ea}

.page-header{padding:32px 20px 16px;max-width:800px;margin:0 auto;text-align:center}
.page-header h1{font-size:1.5rem;font-weight:700;color:var(--t)}

.content{max-width:1000px;margin:0 auto 48px;padding:0 20px}
.sec-title{font-size:1.1rem;font-weight:700;color:var(--t);margin:24px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--border)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{background:var(--card);border-radius:var(--r);padding:18px 16px;box-shadow:var(--sh);transition:all 0.2s;display:flex;flex-direction:column;gap:6px}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.12)}
.card .c-tag{font-size:0.7rem;padding:2px 8px;border-radius:6px;align-self:flex-start;font-weight:500}
.card .c-tag.fh{background:#fdf0ea;color:var(--red)}
.card .c-tag.wa{background:#e8f5e4;color:var(--green)}
.card .c-tag.recipe{background:#e3f2fd;color:#1565c0}
.card .c-name{font-size:1rem;font-weight:650;color:var(--t)}
.card .c-cta{font-size:0.82rem;color:var(--red);font-weight:600}

.empty{padding:40px;text-align:center;color:var(--t3)}
.footer{text-align:center;padding:20px 20px 48px;color:var(--muted);font-size:0.82rem}

@media(max-width:768px){
  .nav-inner{flex-direction:column;height:auto;padding:8px 12px;gap:6px}
  .grid{grid-template-columns:1fr}.content{padding:0 16px}
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a class="nav-logo" href="/">食物真相百科</a>
    <div class="nav-links">
      <a href="/">🏠</a>
      <a href="/category/饮品">🥤</a><a href="/category/零食">🍪</a><a href="/category/主食调味">🍞</a>
      <a href="/category/烹饪方式">🍳</a><a href="/category/保健品">💊</a><a href="/category/蔬果肉类">🥩</a>
      <a href="/all-foods">📋</a><a href="/recipes">🍳菜谱</a>
    </div>
    <div class="nav-user">
      <a href="/favorites" class="active">⭐ 收藏</a>
      <form method="post" action="/logout" style="display:inline"><button type="submit" style="background:none;border:none;color:var(--t3);cursor:pointer;font-size:0.8rem;padding:4px 8px">退出</button></form>
    </div>
  </div>
</nav>

<header class="page-header"><h1>⭐ 我的收藏</h1></header>

<div class="content">
  <div th:if="${#lists.isEmpty(foodFavs) && #lists.isEmpty(recipeFavs)}" class="empty">
    <p>还没有收藏任何内容。</p>
    <p style="margin-top:8px"><a href="/" style="color:var(--red)">去首页看看 →</a></p>
  </div>

  <th:block th:if="${!#lists.isEmpty(foodFavs)}">
    <div class="sec-title">🥝 食物百科收藏 (<span th:text="${#lists.size(foodFavs)}">0</span>)</div>
    <div class="grid">
      <a class="card" th:each="f : ${foodFavs}" th:href="@{/foods/{id}(id=${f.food.id})}">
        <span class="c-tag" th:class="${f.food.tag} == '伪健康' ? 'fh' : 'wa'" th:text="${f.food.tag}">标签</span>
        <div class="c-name" th:text="${f.food.name}">食物名</div>
        <div class="c-cta">查看 →</div>
      </a>
    </div>
  </th:block>

  <th:block th:if="${!#lists.isEmpty(recipeFavs)}">
    <div class="sec-title">🍳 菜谱收藏 (<span th:text="${#lists.size(recipeFavs)}">0</span>)</div>
    <div class="grid">
      <a class="card" th:each="f : ${recipeFavs}" th:href="@{/recipes/{id}(id=${f.recipe.id})}">
        <span class="c-tag recipe" th:text="${f.recipe.category}">分类</span>
        <div class="c-name" th:text="${f.recipe.name}">菜名</div>
        <div class="c-cta">查看 →</div>
      </a>
    </div>
  </th:block>
</div>

<footer class="footer">食物真相百科 · 用科学证据说话</footer>
</body>
</html>

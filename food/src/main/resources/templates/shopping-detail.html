<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title th:text="${s.name} + ' — 买菜指南'">食材详情</title>
<style>
:root{--bg:#f7f4ef;--card:#fff;--t:#2c2416;--t2:#5c4e38;--t3:#8b7a62;--muted:#b5a68e;--green:#2d5a27;--border:#e5dcd0;--r:12px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.7;color:var(--t);background:var(--bg)}
a{text-decoration:none;color:inherit}

.nav{background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.nav-inner{max-width:1300px;margin:0 auto;padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:56px;gap:8px}
.nav-logo{font-size:1rem;font-weight:700;color:var(--t);white-space:nowrap}
.nav-links{display:flex;gap:2px;flex-wrap:wrap;align-items:center}
.nav-links a{padding:6px 12px;border-radius:20px;font-size:0.82rem;color:var(--t2);transition:all 0.2s;white-space:nowrap}
.nav-links a:hover{background:var(--green);color:#fff}
.nav-search{display:flex;align-items:center;gap:0}
.nav-search input{padding:7px 12px;font-size:0.85rem;border:1.5px solid var(--border);border-radius:20px 0 0 20px;background:var(--bg);color:var(--t);outline:none;width:140px}
.nav-search input:focus{border-color:var(--green)}
.nav-search button{padding:7px 14px;font-size:0.85rem;border:1.5px solid var(--green);border-left:none;border-radius:0 20px 20px 0;background:var(--green);color:#fff;cursor:pointer}
.nav-user{display:flex;align-items:center;gap:8px;font-size:0.82rem;margin-left:8px}
.nav-user span{color:var(--t3)}.nav-user a{color:var(--green);font-weight:500;padding:4px 10px;border-radius:12px;white-space:nowrap}
.nav-user a:hover{background:#e8f5e9}

.container{max-width:760px;margin:0 auto 48px;padding:0 20px}
.back-row{padding:20px 0 8px}
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 20px;font-size:0.9rem;border:1px solid var(--border);border-radius:20px;background:var(--card);color:var(--t2);transition:all 0.2s}
.back-btn:hover{border-color:var(--green);color:var(--green)}

.detail-header{margin-bottom:24px}
.detail-header h1{font-size:1.6rem;font-weight:700;color:var(--t);margin-bottom:8px}
.detail-header .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.detail-header .tag{font-size:0.82rem;padding:4px 12px;border-radius:20px;font-weight:500}
.detail-header .tag.cat{background:#e8f5e9;color:var(--green)}
.detail-header .tag.season{background:#e3f2fd;color:#1565c0}

.section-box{background:var(--card);border-radius:var(--r);padding:24px;box-shadow:0 2px 8px rgba(0,0,0,0.04);margin-bottom:16px}
.section-box h2{font-size:1.1rem;font-weight:700;color:var(--t);margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--border)}
.section-box .pick-text{font-size:0.95rem;color:var(--t2);line-height:1.8}
.section-box .pick-text strong{color:var(--green)}

.tip-box{background:#fef9e7;border-radius:var(--r);padding:16px 20px;margin-bottom:16px;font-size:0.9rem;color:#7d6608;border-left:3px solid #f1c40f}
.tip-box strong{color:#5d4e37}

.footer{text-align:center;padding:20px 20px 48px;color:var(--muted);font-size:0.82rem}
@media(max-width:768px){
  .nav-inner{flex-direction:column;height:auto;padding:8px 12px;gap:6px}
  .container{padding:0 16px}.detail-header h1{font-size:1.3rem}
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a class="nav-logo" href="/">食物真相百科</a>
    <div class="nav-links">
      <a href="/">🏠</a>
      <a href="/category/饮品">🥤</a><a href="/category/零食">🍪</a><a href="/category/主食调味">🍞</a>
      <a href="/category/烹饪方式">🍳</a><a href="/category/保健品">💊</a><a href="/category/蔬果肉类">🥩</a>
      <a href="/all-foods">📋</a><a href="/recipes">🍳菜谱</a><a href="/shopping">🛒买菜</a>
    </div>
    <div class="nav-user" sec:authorize="!isAuthenticated()"><a href="/login">登录</a></div>
    <div class="nav-user" sec:authorize="isAuthenticated()">
      <a href="/favorites">⭐收藏</a><span sec:authentication="name">用户</span>
      <form method="post" action="/logout" style="display:inline"><button type="submit" style="background:none;border:none;color:var(--t3);cursor:pointer;font-size:0.8rem">退出</button></form>
    </div>
    <form class="nav-search" action="/search" method="get">
      <input type="text" name="q" placeholder="搜索..."><button>🔍</button>
    </form>
  </div>
</nav>

<div class="container">
  <div class="back-row"><a class="back-btn" href="/shopping">← 返回买菜指南</a></div>

  <div class="detail-header">
    <h1 th:text="${s.name}">食材名</h1>
    <div class="meta">
      <span class="tag cat" th:text="${s.category}">分类</span>
      <span class="tag season" th:if="${s.season != null and !s.season.isEmpty()}" th:text="'📅 ' + ${s.season}">季节</span>
    </div>
  </div>

  <div class="section-box">
    <h2>🔍 怎么挑</h2>
    <div class="pick-text" th:utext="${#strings.replace(s.howToPick, '。', '。<br>')}">挑选方法</div>
  </div>

  <div class="tip-box" th:if="${s.storageTips != null and !s.storageTips.isEmpty()}">
    <strong>📦 怎么存：</strong><span th:text="${s.storageTips}">保存方法</span>
  </div>
</div>

<footer class="footer">食物真相百科 · 用科学证据说话</footer>
</body>
</html>

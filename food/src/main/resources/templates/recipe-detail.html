<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title th:text="${recipe.name} + ' — 食物真相百科'">菜谱详情</title>
<style>
:root{--bg:#f7f4ef;--card:#fff;--t:#2c2416;--t2:#5c4e38;--t3:#8b7a62;--muted:#b5a68e;--green:#2d5a27;--border:#e5dcd0;--r:12px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.7;color:var(--t);background:var(--bg)}
a{text-decoration:none;color:inherit}

.nav{background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.nav-inner{max-width:1300px;margin:0 auto;padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:56px;gap:8px}
.nav-logo{font-size:1rem;font-weight:700;color:var(--t);white-space:nowrap}
.nav-links{display:flex;gap:2px;flex-wrap:wrap;align-items:center}
.nav-links a{padding:6px 12px;border-radius:20px;font-size:0.82rem;color:var(--t2);transition:all 0.2s;white-space:nowrap}
.nav-links a:hover{background:var(--green);color:#fff}
.nav-search{display:flex;align-items:center;gap:0}
.nav-search input{padding:7px 12px;font-size:0.85rem;border:1.5px solid var(--border);border-radius:20px 0 0 20px;background:var(--bg);color:var(--t);outline:none;width:140px}
.nav-search input:focus{border-color:var(--green)}
.nav-search button{padding:7px 14px;font-size:0.85rem;border:1.5px solid var(--green);border-left:none;border-radius:0 20px 20px 0;background:var(--green);color:#fff;cursor:pointer}
.fav-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;font-size:0.9rem;border:1.5px solid #f1c40f;border-radius:20px;background:#fff;color:#7d6608;cursor:pointer;transition:all 0.2s;margin-left:12px}.fav-btn:hover{background:#fef9e7}.fav-btn.active{background:#f1c40f;color:#fff;border-color:#f1c40f}
.nav-user{display:flex;align-items:center;gap:8px;font-size:0.82rem}.nav-user span{color:var(--t3)}.nav-user a{color:var(--green);font-weight:500;padding:4px 10px;border-radius:12px}.nav-user a:hover{background:#e8f5e9}

.container{max-width:760px;margin:0 auto 48px;padding:0 20px}
.back-row{padding:20px 0 8px}
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 20px;font-size:0.9rem;border:1px solid var(--border);border-radius:20px;background:var(--card);color:var(--t2);transition:all 0.2s}
.back-btn:hover{border-color:var(--green);color:var(--green)}

.recipe-header{margin-bottom:24px}
.recipe-header h1{font-size:1.6rem;font-weight:700;color:var(--t);margin-bottom:8px}
.recipe-header .desc{font-size:0.95rem;color:var(--t3);margin-bottom:12px}
.recipe-tags{display:flex;gap:8px;flex-wrap:wrap}
.recipe-tags span{padding:4px 12px;border-radius:20px;font-size:0.82rem;font-weight:500}
.recipe-tags .t-diff{background:#fff3e0;color:#e65100}
.recipe-tags .t-time{background:#e8f5e9;color:var(--green)}
.recipe-tags .t-cost{background:#e3f2fd;color:#1565c0}
.recipe-tags .t-cat{background:#fce4ec;color:#c62828}

.section-box{background:var(--card);border-radius:var(--r);padding:24px;box-shadow:0 2px 8px rgba(0,0,0,0.04);margin-bottom:16px}
.section-box h2{font-size:1.1rem;font-weight:700;color:var(--t);margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--border)}
.section-box .ingredient-line{font-size:0.95rem;color:var(--t2);padding:4px 0}
.section-box .step-line{font-size:0.95rem;color:var(--t2);padding:6px 0;line-height:1.7}
.section-box .step-num{display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;background:var(--green);color:#fff;border-radius:50%;font-size:0.78rem;font-weight:700;margin-right:8px}
.tip-box{background:#fef9e7;border-radius:var(--r);padding:16px 20px;margin-bottom:16px;font-size:0.9rem;color:#7d6608;border-left:3px solid #f1c40f}
.tip-box strong{color:#5d4e37}
.health-box{background:#e8f5e9;border-radius:var(--r);padding:16px 20px;margin-bottom:16px;font-size:0.9rem;color:var(--green);border-left:3px solid var(--green)}
.health-box strong{color:#1b5e20}

.footer{text-align:center;padding:20px 20px 48px;color:var(--muted);font-size:0.82rem}
@media(max-width:768px){
  .nav-inner{flex-direction:column;height:auto;padding:8px 12px;gap:6px}
  .container{padding:0 16px}
  .recipe-header h1{font-size:1.3rem}
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a class="nav-logo" href="/">食物真相百科</a>
    <div class="nav-links">
      <a href="/">🏠</a>
      <a href="/category/饮品">🥤</a><a href="/category/零食">🍪</a><a href="/category/主食调味">🍞</a>
      <a href="/category/烹饪方式">🍳</a><a href="/category/保健品">💊</a><a href="/category/蔬果肉类">🥩</a>
      <a href="/all-foods">📋</a>
      <a href="/recipes">🍳 菜谱</a><a href="/shopping">🛒买菜</a>
    </div>
    <div class="nav-user" sec:authorize="!isAuthenticated()"><a href="/login">登录</a></div>
    <div class="nav-user" sec:authorize="isAuthenticated()">
      <a href="/favorites">⭐</a><span sec:authentication="name">用户</span>
      <form method="post" action="/logout" style="display:inline"><button type="submit" style="background:none;border:none;color:var(--t3);cursor:pointer;font-size:0.8rem">退出</button></form>
    </div>
    <form class="nav-search" action="/search" method="get">
      <input type="text" name="q" placeholder="搜索食物...">
      <button type="submit">🔍</button>
    </form>
  </div>
</nav>

<div class="container">
  <div class="back-row"><a class="back-btn" href="/recipes">← 返回菜谱</a></div>

  <div class="recipe-header">
    <h1 th:text="${recipe.name}">菜名</h1>
    <button class="fav-btn" id="favBtn" sec:authorize="isAuthenticated()" onclick="toggleFav()">☆ 收藏</button>
    <p class="desc" th:text="${recipe.description}">描述</p>
    <div class="recipe-tags">
      <span class="t-cat" th:text="${recipe.category}">分类</span>
      <span class="t-diff" th:text="${recipe.difficulty}">难度</span>
      <span class="t-time" th:text="${recipe.cookingTime}">用时</span>
      <span class="t-cost" th:text="${recipe.costLevel}">花费</span>
    </div>
  </div>

  <div class="section-box" th:if="${recipe.ingredients != null and !recipe.ingredients.isEmpty()}">
    <h2>🥬 食材</h2>
    <div class="ingredient-line" th:each="line : ${recipe.ingredients.split('\n')}" th:text="${line}">食材</div>
  </div>

  <div class="section-box" th:if="${recipe.steps != null and !recipe.steps.isEmpty()}">
    <h2>👨‍🍳 步骤</h2>
    <div class="step-line" th:each="line,iterStat : ${recipe.steps.split('\n')}">
      <span class="step-num" th:text="${iterStat.index + 1}">1</span><span th:text="${line}">步骤</span>
    </div>
  </div>

  <div class="tip-box" th:if="${recipe.tips != null and !recipe.tips.isEmpty()}">
    <strong>💡 小贴士：</strong><span th:text="${recipe.tips}">贴士</span>
  </div>

  <div class="health-box" th:if="${recipe.healthNote != null and !recipe.healthNote.isEmpty()}">
    <strong>🥗 健康说明：</strong><span th:text="${recipe.healthNote}">健康</span>
  </div>
</div>

<footer class="footer">食物真相百科 · 用科学证据说话</footer>
<script>
var favBtn=document.getElementById("favBtn");
function toggleFav(){fetch("/favorite/toggle/recipe/[[${recipe.id}]]",{method:"POST"}).then(function(r){return r.json()}).then(function(d){if(d.favorited){favBtn.textContent="★ 已收藏";favBtn.classList.add("active")}else{favBtn.textContent="☆ 收藏";favBtn.classList.remove("active")}});}
</script>
</body>
</html>

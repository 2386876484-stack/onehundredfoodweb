<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>食物真相百科</title>
<style>
:root{--bg:#f7f4ef;--card:#fff;--t:#2c2416;--t2:#5c4e38;--t3:#8b7a62;--muted:#b5a68e;--red:#8b4513;--green:#2d5a27;--border:#e5dcd0;--r:12px;--sh:0 2px 12px rgba(0,0,0,0.06)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.7;color:var(--t);background:var(--bg)}
a{text-decoration:none;color:inherit}

.nav{background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.nav-inner{max-width:1300px;margin:0 auto;padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:56px;gap:4px}
.nav-logo{font-size:1rem;font-weight:700;color:var(--t);white-space:nowrap}
.nav-links{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}
.nav-links a{padding:6px 12px;border-radius:20px;font-size:0.82rem;color:var(--t2);transition:all 0.2s;white-space:nowrap}
.nav-links a:hover,.nav-links a.active{background:var(--red);color:#fff}
.nav-search{display:flex;align-items:center;gap:0}
.nav-search input{padding:7px 12px;font-size:0.85rem;border:1.5px solid var(--border);border-radius:20px 0 0 20px;background:var(--bg);color:var(--t);outline:none;width:140px}
.nav-search input:focus{border-color:var(--red)}
.nav-search button{padding:7px 14px;font-size:0.85rem;border:1.5px solid var(--red);border-left:none;border-radius:0 20px 20px 0;background:var(--red);color:#fff;cursor:pointer}
.nav-user{display:flex;align-items:center;gap:8px;font-size:0.82rem;margin-left:8px}
.nav-user span{color:var(--t3)}.nav-user a{color:var(--red);font-weight:500;padding:4px 10px;border-radius:12px;white-space:nowrap}
.nav-user a:hover{background:#fdf0ea}

.hero{text-align:center;padding:52px 20px 32px;max-width:720px;margin:0 auto}
.hero h1{font-size:2.2rem;font-weight:800;color:var(--t);letter-spacing:0.05em;margin-bottom:6px}
.hero .tagline{font-size:1.1rem;color:var(--red);font-weight:500;margin-bottom:16px}
.hero .stats{font-size:0.9rem;color:var(--t3);margin-bottom:24px}

/* category quick nav */
.cat-quick{max-width:900px;margin:0 auto 36px;padding:0 20px}
.cat-quick-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:20px}
.cat-quick-card{background:var(--card);border-radius:var(--r);padding:16px 10px;text-align:center;box-shadow:0 1px 6px rgba(0,0,0,0.04);transition:all 0.25s;border:2px solid transparent}
.cat-quick-card:hover{border-color:var(--red);box-shadow:0 4px 16px rgba(139,69,19,0.1);transform:translateY(-2px)}
.cat-quick-card .cq-emoji{font-size:1.6rem;margin-bottom:2px}
.cat-quick-card .cq-name{font-size:0.85rem;font-weight:600;color:var(--t)}

/* tag bar */
.tag-bar{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.tag-bar span{font-size:0.85rem;color:var(--t2)}
.tag-bar .tb-red{color:var(--red);font-weight:600}
.tag-bar .tb-green{color:var(--green);font-weight:600}

/* Featured */
.section-title{text-align:center;font-size:1.1rem;font-weight:700;color:var(--t);margin:40px 0 18px}
.feat-grid{max-width:1200px;margin:0 auto 56px;padding:0 20px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.feat-card{background:var(--card);border-radius:var(--r);padding:20px 18px;box-shadow:var(--sh);transition:all 0.25s;display:flex;flex-direction:column;gap:8px}
.feat-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.12)}
.feat-card .fc-top{display:flex;justify-content:space-between;align-items:flex-start}
.feat-card .fc-emoji{font-size:1.5rem}
.feat-card .fc-tag{font-size:0.7rem;padding:2px 8px;border-radius:6px;font-weight:500}
.feat-card .fc-tag.fh{background:#fdf0ea;color:var(--red)}
.feat-card .fc-tag.wa{background:#e8f5e4;color:var(--green)}
.feat-card .fc-name{font-size:1.05rem;font-weight:700;color:var(--t)}
.feat-card .fc-hook{font-size:0.88rem;color:var(--t2);line-height:1.6;flex:1}
.feat-card .fc-footer{display:flex;justify-content:space-between;align-items:center;font-size:0.78rem;color:var(--muted)}
.feat-card .fc-cta{color:var(--red);font-weight:600}

.footer{text-align:center;padding:20px 20px 48px;color:var(--muted);font-size:0.82rem}

@media(max-width:768px){
  .hero{padding:36px 16px 20px}.hero h1{font-size:1.7rem}
  .cat-quick-grid{grid-template-columns:repeat(3,1fr);gap:8px}
  .feat-grid{grid-template-columns:1fr;padding:0 16px}
  .nav-inner{flex-direction:column;height:auto;padding:8px 12px;gap:6px}
  .nav-links a{padding:5px 10px;font-size:0.75rem}
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a class="nav-logo" href="/">食物真相百科</a>
    <div class="nav-links">
      <a href="/" class="active">🏠 首页</a>
      <a th:each="c : ${categories}"
         th:href="@{/category/{name}(name=${c})}"
         th:text="${catEmoji.getOrDefault(c,'📂')} + ' ' + ${c}">分类</a>
      <a href="/all-foods">📋 全部</a><a href="/recipes">🍳 菜谱</a><a href="/shopping">🛒买菜</a>
    </div>
    <div class="nav-user" sec:authorize="!isAuthenticated()"><a href="/login">登录</a></div>
    <div class="nav-user" sec:authorize="isAuthenticated()">
      <a href="/favorites">⭐收藏</a><span sec:authentication="name">用户</span>
      <form method="post" action="/logout" style="display:inline"><button type="submit" style="background:none;border:none;color:var(--t3);cursor:pointer;font-size:0.8rem">退出</button></form>
    </div>
    <form class="nav-search" action="/search" method="get">
      <input type="text" name="q" placeholder="搜索食物...">
      <button type="submit">🔍</button>
    </form>
  </div>
</nav>

<header class="hero">
  <h1>食物真相百科</h1>
  <p class="tagline">你以为的健康，可能恰恰相反</p>
  <p class="stats" th:text="${totalFoods} + ' 种常见食物 · ' + ${totalMyths} + ' 条科学真相'">34 种食物 · 45 条真相</p>
</header>

<div class="cat-quick">
  <div class="cat-quick-grid">
    <a class="cat-quick-card" th:each="c : ${categories}"
       th:href="@{/category/{name}(name=${c})}">
      <div class="cq-emoji" th:text="${catEmoji.getOrDefault(c,'📂')}">🥤</div>
      <div class="cq-name" th:text="${c}">分类</div>
    </a>
  </div>
  <div class="tag-bar">
    <span>🔴 <span class="tb-red" th:text="${tagCounts['伪健康']} + ' 种伪健康'">X 种</span> — 你以为健康，其实有坑</span>
    <span>🟢 <span class="tb-green" th:text="${tagCounts['被冤枉']} + ' 种被冤枉'">X 种</span> — 被误解太久，其实OK</span>
  </div>
</div>

<div class="section-title">🔍 精选推荐</div>
<div class="feat-grid">
  <a class="feat-card" th:each="f : ${featured}" th:href="@{/foods/{id}(id=${f.id})}">
    <div class="fc-top">
      <span class="fc-emoji" th:text="${foodEmoji.getOrDefault(f.name,'📋')}">🥝</span>
      <span class="fc-tag" th:class="${f.tag} == '伪健康' ? 'fh' : 'wa'"
            th:text="${f.tag}">标签</span>
    </div>
    <div class="fc-name" th:text="${f.name}">食物名</div>
    <div class="fc-hook" th:if="${!#lists.isEmpty(f.myths)}" th:text="'❌ ' + ${f.myths[0].myth}">误区</div>
    <div class="fc-footer">
      <span th:text="${#lists.size(f.myths)} + ' 条真相'">X条</span>
      <span class="fc-cta">查看 →</span>
    </div>
  </a>
</div>

<footer class="footer">食物真相百科 · 用科学证据说话</footer>
</body>
</html>
